{% extends "base.html" %}

{% block title %}DevShop - Produto{% endblock %}

{% block content %}
<div class="glass-panel" id="product-detail-container">
    <div style="text-align: center; color: var(--text-secondary);">Carregando detalhes...</div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', async () => {
    try {
        const productId = {{ product_id }};
        const p = await api.getProduct(productId);
        const container = document.getElementById('product-detail-container');
        
        container.innerHTML = `
            <div style="display: flex; gap: 3rem; flex-wrap: wrap;">
                <div style="flex: 1; min-width: 300px;">
                    <img src="${p.image_url}" alt="${p.name}" style="width: 100%; border-radius: var(--radius); border: 1px solid var(--border-color);">
                </div>
                <div style="flex: 1; min-width: 300px; display: flex; flex-direction: column;">
                    <h1 style="font-size: 2.5rem; margin-bottom: 1rem;">${p.name}</h1>
                    <p style="font-size: 1.1rem; color: var(--text-secondary); margin-bottom: 2rem; line-height: 1.8;">${p.description}</p>
                    <div style="font-size: 2.5rem; font-weight: 800; color: var(--primary-color); margin-bottom: 2rem;">$ ${p.price.toFixed(2)}</div>
                    
                    <button class="btn" style="font-size: 1.25rem; padding: 1rem;" onclick="handleAddToCart(${p.id})">Adicionar ao Carrinho</button>
                    <a href="/products" class="btn btn-outline" style="margin-top: 1rem; text-align: center;">Voltar</a>
                </div>
            </div>
        `;
    } catch (e) {
        document.getElementById('product-detail-container').innerHTML = '<p style="color:red">Erro ao carregar produto.</p>';
    }
});
</script>
{% endblock %}
