{% extends "base.html" %}

{% block title %}DevShop - Checkout{% endblock %}

{% block content %}
<div class="page-header">
    <h2>Checkout</h1>
</div>

<div class="glass-panel" style="max-width: 600px; margin: 0 auto;">
    <form id="checkout-form">
        <div class="form-group">
            <label for="name">Nome Completo</label>
            <input type="text" id="name" class="form-control" required placeholder="John Doe">
        </div>
        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" class="form-control" required placeholder="john@example.com">
        </div>
        <button type="submit" class="btn" style="width: 100%; padding: 1rem; font-size: 1.1rem; margin-top: 1rem;">Confirmar Pedido</button>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('checkout-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    
    try {
        const order = await api.checkout(name, email);
        showToast('Pedido realizado com sucesso!');
        updateCartCount();
        setTimeout(() => {
            window.location.href = '/orders';
        }, 1500);
    } catch (err) {
        alert(err.message || 'Erro ao processar checkout');
    }
});
</script>
{% endblock %}
