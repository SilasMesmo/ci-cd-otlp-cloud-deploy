<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DevShop | Lab Ecommerce{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Particles.js library -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
</head>
<body>
    <div id="particles-js"></div>
    <nav class="navbar">
        <a href="/" class="brand">
            Dev<span>Shop</span>
        </a>
        <div class="nav-links">
            <div class="env-badge" title="Displays current ReplicaSet version and environment for Kubernetes visibility">
                Env: <strong>{{ environment }}</strong> | Ver: <strong>{{ app_version }}</strong>
            </div>
            <a href="/products">Products</a>
            <a href="/cart">Cart (<span id="cart-count">0</span>)</a>
            <a href="/orders">Orders</a>
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <script src="/static/js/main.js"></script>
    {% block scripts %}{% endblock %}
    
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        particlesJS('particles-js', {
            "particles": {
                "number": { "value": 50, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#00f3ff" }, /* Bright Neon Cyan */
                "shape": { "type": "circle" },
                "opacity": { 
                    "value": 0.8, 
                    "random": true, 
                    "anim": { "enable": true, "speed": 1, "opacity_min": 0.3, "sync": false } 
                },
                "size": { 
                    "value": 4, 
                    "random": true, 
                    "anim": { "enable": true, "speed": 2, "size_min": 1, "sync": false } 
                },
                "line_linked": {
                    "enable": true,
                    "distance": 150,
                    "color": "#00f3ff",
                    "opacity": 0.6,
                    "width": 2
                },
                "move": {
                    "enable": true,
                    "speed": 2,
                    "direction": "none",
                    "random": true,
                    "straight": false,
                    "out_mode": "out",
                    "bounce": false,
                }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": {
                    "onhover": { "enable": true, "mode": "grab" },
                    "onclick": { "enable": true, "mode": "push" },
                    "resize": true
                },
                "modes": {
                    "grab": { "distance": 180, "line_linked": { "opacity": 1 } },
                    "push": { "particles_nb": 4 }
                }
            },
            "retina_detect": true
        });
    });
    </script>
</body>
</html>
